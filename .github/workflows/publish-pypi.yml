name: Publish QACraft to PyPI

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        default: v1.4.0
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-pypi.yml"

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: pypi-${{ github.event.release.tag_name || inputs.tag || 'v1.4.0' }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish verified artifacts
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/qacraft/

    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          tag="${{ github.event.release.tag_name || inputs.tag || 'v1.4.0' }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate tagged release
        shell: bash
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "${{ steps.release.outputs.tag }}" = "v${version}"
          python3 scripts/generate_docs.py
          python3 scripts/validate_repo.py
          python3 scripts/qacraft.py release-check
          git diff --exit-code

      - name: Build wheel and source distribution
        run: |
          python3 -m pip install --disable-pip-version-check build
          python3 -m build --sdist --wheel --outdir dist

      - name: Publish with PyPI Trusted Publishing
        id: publish
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          print-hash: true

      - name: Record PyPI publication result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          if [ "$PUBLISH_OUTCOME" = "success" ]; then
            status="published successfully to https://pypi.org/project/qacraft/"
          else
            status="not published. Configure a PyPI pending Trusted Publisher with owner SUDARSHANCHAUDHARI, repository QACraft, workflow publish-pypi.yml, environment pypi, then re-run this workflow"
          fi
          gh issue comment 16 --body "## PyPI publication — ${RELEASE_TAG}\n\nQACraft was ${status}.\n\nWorkflow run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Fail when publication was not accepted
        if: steps.publish.outcome != 'success'
        run: exit 1
