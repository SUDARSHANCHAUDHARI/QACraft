name: Publish QACraft release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated release tag to publish
        required: true
        default: v1.4.1

permissions:
  contents: write
  id-token: write
  issues: write

concurrency:
  group: release-${{ github.event.ref || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish verified release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/qacraft/

    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          tag="${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}"
          test -n "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate tagged release
        shell: bash
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "${{ steps.release.outputs.tag }}" = "v${version}"
          git cat-file -t "${{ steps.release.outputs.tag }}" | grep -qx tag
          python3 scripts/generate_docs.py
          python3 scripts/validate_repo.py
          python3 scripts/qacraft.py release-check
          git diff --exit-code

      - name: Build wheel and source distribution once
        run: |
          python3 -m pip install --disable-pip-version-check build
          python3 -m build --sdist --wheel --outdir dist
          python3 - <<'PY'
          import hashlib
          from pathlib import Path

          for path in sorted(Path("dist").iterdir()):
              print(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}")
          PY

      - name: Create or update GitHub Release with exact artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --verify-tag \
              --generate-notes \
              --title "QACraft ${TAG#v}"
          fi

      - name: Publish the same artifacts to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          print-hash: true

      - name: Record publication result
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          gh issue comment 22 --body "## ${TAG} published

          The validated wheel and source distribution were built once and the exact same files were published to GitHub Releases and PyPI.

          Workflow run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
