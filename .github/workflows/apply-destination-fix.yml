name: Apply destination safety repair

on:
  push:
    branches:
      - fix/require-existing-destination
    paths:
      - ".github/workflows/apply-destination-fix.yml"

permissions:
  contents: write

jobs:
  repair:
    name: Repair and validate QACraft 1.4.1
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repair branch
        uses: actions/checkout@v7
        with:
          ref: fix/require-existing-destination
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Apply focused repair
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"Expected exactly one match in {path}: {old[:80]!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          installer = Path("scripts/qacraft_installer.py")
          text = installer.read_text(encoding="utf-8")
          old_resolver = '''def resolve_destination(destination: Path) -> Path:
              expanded = destination.expanduser()
              parent = expanded.parent.resolve(strict=True)
              candidate = parent / expanded.name
              if candidate == candidate.parent:
                  raise InstallError("Destination cannot be a filesystem root.")
              if candidate.is_symlink():
                  raise InstallError("Destination cannot be a symbolic link.")
              if candidate.exists() and not candidate.is_dir():
                  raise InstallError("Destination must be a directory or a new path.")
              return candidate.resolve(strict=True) if candidate.exists() else candidate
          '''
          new_resolver = '''def resolve_destination(destination: Path) -> Path:
              expanded = destination.expanduser()
              if expanded.is_symlink():
                  raise InstallError("Destination cannot be a symbolic link.")
              try:
                  candidate = expanded.resolve(strict=True)
              except FileNotFoundError as exc:
                  raise InstallError(
                      f"Destination directory does not exist: {expanded}. "
                      "Create or select the project directory explicitly before running QACraft."
                  ) from exc
              if candidate == candidate.parent:
                  raise InstallError("Destination cannot be a filesystem root.")
              if not candidate.is_dir():
                  raise InstallError("Destination must be an existing directory.")
              return candidate
          '''
          if old_resolver not in text:
              raise SystemExit("resolve_destination implementation did not match expected source")
          text = text.replace(old_resolver, new_resolver, 1)
          text = text.replace("        destination.mkdir(parents=True, exist_ok=True)\n", "", 1)
          installer.write_text(text, encoding="utf-8")

          installer_tests = Path("tests/test_qacraft_installer.py")
          text = installer_tests.read_text(encoding="utf-8")
          insert = '''    def test_rejects_nonexistent_destination(self):
              with tempfile.TemporaryDirectory() as parent:
                  destination = Path(parent) / "missing-project"

                  with self.assertRaisesRegex(InstallError, "does not exist"):
                      build_install_plan(
                          ROOT,
                          destination,
                          ["skills/feature-qa/SKILL.md"],
                      )

                  self.assertFalse(destination.exists())

          '''
          marker = "    def test_rejects_symlink_destination(self):\n"
          if marker not in text:
              raise SystemExit("installer test insertion point missing")
          text = text.replace(marker, insert + marker, 1)
          text = text.replace(
              '''        with tempfile.TemporaryDirectory() as parent:
                      destination = Path(parent) / "destination"
                      with self.assertRaisesRegex(InstallError, "Unsafe source path"):
          ''',
              '''        with tempfile.TemporaryDirectory() as parent:
                      destination = Path(parent) / "destination"
                      destination.mkdir()
                      with self.assertRaisesRegex(InstallError, "Unsafe source path"):
          ''',
              1,
          )
          installer_tests.write_text(text, encoding="utf-8")

          cli_tests = Path("tests/test_qacraft_cli.py")
          text = cli_tests.read_text(encoding="utf-8")
          old_preview = '''    def test_generic_install_without_apply_is_preview_only(self):
              with tempfile.TemporaryDirectory() as parent:
                  destination = Path(parent) / "skills"
                  result = self.run_cli(
                      "install",
                      "feature-qa",
                      "--destination",
                      str(destination),
                  )
                  self.assertEqual(result.returncode, 0, result.stderr)
                  plan = json.loads(result.stdout)
                  self.assertEqual(plan["mode"], "preview-only")
                  self.assertFalse(plan["writes_performed"])
                  self.assertFalse(destination.exists())

          '''
          new_preview = '''    def test_generic_install_preview_rejects_nonexistent_destination(self):
              with tempfile.TemporaryDirectory() as parent:
                  destination = Path(parent) / "missing-project"
                  result = self.run_cli(
                      "install",
                      "feature-qa",
                      "--destination",
                      str(destination),
                  )
                  self.assertEqual(result.returncode, 1)
                  self.assertIn("does not exist", result.stderr)
                  self.assertFalse(destination.exists())

              def test_generic_install_apply_rejects_nonexistent_destination(self):
                  with tempfile.TemporaryDirectory() as parent:
                      destination = Path(parent) / "missing-project"
                      result = self.run_cli(
                          "install",
                          "feature-qa",
                          "--destination",
                          str(destination),
                          "--apply",
                      )
                      self.assertEqual(result.returncode, 1)
                      self.assertIn("does not exist", result.stderr)
                      self.assertFalse(destination.exists())

          '''
          if old_preview not in text:
              raise SystemExit("CLI preview test did not match expected source")
          text = text.replace(old_preview, new_preview, 1)
          text = text.replace(
              '''        with tempfile.TemporaryDirectory() as parent:
                      destination = Path(parent) / "skills"
                      result = self.run_cli(
                          "install",
                          "feature-qa",
          ''',
              '''        with tempfile.TemporaryDirectory() as parent:
                      destination = Path(parent) / "skills"
                      destination.mkdir()
                      result = self.run_cli(
                          "install",
                          "feature-qa",
          ''',
              1,
          )
          cli_tests.write_text(text, encoding="utf-8")

          replace_once("pyproject.toml", 'version = "1.4.0"', 'version = "1.4.1"')
          replace_once(
              "pyproject.toml",
              'Documentation = "https://github.com/SUDARSHANCHAUDHARI/QACraft/tree/main/docs"',
              'Documentation = "https://sudarshanchaudhari.github.io/QACraft/"',
          )

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          section = '''## 1.4.1 — 2026-07-23

          ### Fixed

          - Installation planning and application now require `--destination` to reference an existing directory.
          - Mistyped or nonexistent project roots fail with a controlled error and are never created or populated.
          - The release workflow builds artifacts once and publishes the same wheel and source archive to GitHub Releases and PyPI.

          ### Safety

          - QACraft still creates only documented managed subdirectories inside an explicitly selected existing project root.
          - Preview, apply, update, verification, and uninstall share the same existing-directory boundary.
          - Regression coverage verifies both preview and apply leave nonexistent destinations untouched.

          '''
          marker = "## 1.4.0 — 2026-07-22\n"
          if marker not in text:
              raise SystemExit("changelog insertion point missing")
          changelog.write_text(text.replace(marker, section + marker, 1), encoding="utf-8")

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          text = text.replace("QACraft 1.4.0 includes:", "QACraft 1.4.1 includes:", 1)
          text = text.replace("qacraft-1.4.0-py3-none-any.whl", "qacraft-1.4.1-py3-none-any.whl", 1)
          text = text.replace(
              "No PyPI or other package-index publication is claimed or performed.",
              "The public package is available with `python3 -m pip install qacraft==1.4.1`.",
              1,
          )
          text = text.replace(
              "Each adapter uses an officially documented project skill location and a separate QACraft manifest.\n",
              "Each adapter uses an officially documented project skill location and a separate QACraft manifest. The `--destination` must already exist and must be the intended project root; QACraft never creates a missing root.\n",
              1,
          )
          text = text.replace(
              "The generated site already lives under `/docs`. GitHub Pages may be enabled manually using branch-based publishing when the repository plan and visibility support it. No additional automatic Pages workflow is required.",
              "Published documentation is available at <https://sudarshanchaudhari.github.io/QACraft/> and is deployed by `.github/workflows/pages.yml`.",
              1,
          )
          readme.write_text(text, encoding="utf-8")

          installation = Path("docs/INSTALLATION.md")
          text = installation.read_text(encoding="utf-8")
          text = text.replace("QACraft 1.4.0", "QACraft 1.4.1", 1)
          text = text.replace("qacraft-1.4.0-py3-none-any.whl", "qacraft-1.4.1-py3-none-any.whl", 1)
          text = text.replace("qacraft-1.4.0.tar.gz", "qacraft-1.4.1.tar.gz", 1)
          text = text.replace(
              "No package-index publication is currently claimed. Use artifacts built from a trusted commit.",
              "Install the public package with `python3 -m pip install qacraft==1.4.1`.",
              1,
          )
          text = text.replace(
              "The destination is the target project root. Preview is the default:",
              "The destination is the target project root and must already exist. QACraft refuses missing paths rather than creating a possibly mistyped project root. Preview is the default:",
              1,
          )
          installation.write_text(text, encoding="utf-8")

          index = Path("docs/index.md")
          text = index.read_text(encoding="utf-8")
          text = text.replace(
              "[QACraft 1.4.0 release](https://github.com/SUDARSHANCHAUDHARI/QACraft/releases/tag/v1.4.0)",
              "[Latest QACraft release](https://github.com/SUDARSHANCHAUDHARI/QACraft/releases/latest)",
              1,
          )
          index.write_text(text, encoding="utf-8")

          publishing = Path("docs/PUBLISHING.md")
          text = publishing.read_text(encoding="utf-8")
          text = text.replace(
              "QACraft uses OpenID Connect through `.github/workflows/publish-pypi.yml`. No long-lived PyPI API token is required.",
              "QACraft uses OpenID Connect through `.github/workflows/publish-pypi.yml`. The workflow builds once, creates or updates the GitHub Release with those artifacts, and publishes the exact same files to PyPI. No long-lived PyPI API token is required.",
              1,
          )
          text = text.replace(
              "For the first publication, create a pending Trusted Publisher in the PyPI account before re-running the workflow for `v1.4.0`. A pending publisher does not reserve the project name until publication succeeds.\n\nThe workflow validates the tag and repository, builds a wheel and source distribution, and publishes both artifacts. Future GitHub Releases trigger the workflow automatically.",
              "The Trusted Publisher is configured for the `pypi` environment. Releases are initiated by pushing an annotated version tag such as `v1.4.1`, or by manually running the workflow with an existing tag.\n\nThe workflow validates the tag and repository, builds a wheel and source distribution once, attaches those exact files to the GitHub Release, and publishes the same bytes to PyPI.",
              1,
          )
          text = text.replace(
              "- Publish only an existing annotated release tag.",
              "- Publish only an annotated version tag that matches `pyproject.toml`.",
              1,
          )
          publishing.write_text(text, encoding="utf-8")

          Path(".github/workflows/publish-pypi.yml").write_text('''name: Publish QACraft release

          on:
            push:
              tags:
                - "v*"
            workflow_dispatch:
              inputs:
                tag:
                  description: Existing annotated release tag to publish
                  required: true
                  default: v1.4.1

          permissions:
            contents: write
            id-token: write
            issues: write

          concurrency:
            group: release-${{ github.event.ref || inputs.tag }}
            cancel-in-progress: false

          jobs:
            publish:
              name: Publish verified release artifacts
              runs-on: ubuntu-latest
              timeout-minutes: 10
              environment:
                name: pypi
                url: https://pypi.org/project/qacraft/

              steps:
                - name: Resolve release tag
                  id: release
                  shell: bash
                  run: |
                    tag="${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}"
                    test -n "$tag"
                    echo "tag=$tag" >> "$GITHUB_OUTPUT"

                - name: Check out tagged source
                  uses: actions/checkout@v7
                  with:
                    ref: ${{ steps.release.outputs.tag }}
                    fetch-depth: 0

                - name: Set up Python
                  uses: actions/setup-python@v7
                  with:
                    python-version: "3.12"

                - name: Validate tagged release
                  shell: bash
                  run: |
                    version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
                    test "${{ steps.release.outputs.tag }}" = "v${version}"
                    git cat-file -t "${{ steps.release.outputs.tag }}" | grep -qx tag
                    python3 scripts/generate_docs.py
                    python3 scripts/validate_repo.py
                    python3 scripts/qacraft.py release-check
                    git diff --exit-code

                - name: Build wheel and source distribution once
                  run: |
                    python3 -m pip install --disable-pip-version-check build
                    python3 -m build --sdist --wheel --outdir dist
                    python3 - <<'PY2'
                    import hashlib
                    from pathlib import Path
                    for path in sorted(Path("dist").iterdir()):
                        print(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}")
                    PY2

                - name: Create or update GitHub Release with exact artifacts
                  env:
                    GH_TOKEN: ${{ github.token }}
                    TAG: ${{ steps.release.outputs.tag }}
                  shell: bash
                  run: |
                    if gh release view "$TAG" >/dev/null 2>&1; then
                      gh release upload "$TAG" dist/* --clobber
                    else
                      gh release create "$TAG" dist/* --verify-tag --generate-notes --title "QACraft ${TAG#v}"
                    fi

                - name: Publish the same artifacts to PyPI
                  uses: pypa/gh-action-pypi-publish@release/v1
                  with:
                    packages-dir: dist/
                    print-hash: true

                - name: Record publication result
                  if: success()
                  env:
                    GH_TOKEN: ${{ github.token }}
                    TAG: ${{ steps.release.outputs.tag }}
                  run: |
                    gh issue comment 22 --body "## ${TAG} published\n\nThe validated wheel and source distribution were built once and the exact same files were published to GitHub Releases and PyPI.\n\nWorkflow run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          ''', encoding="utf-8")

          Path(".github/workflows/apply-destination-fix.yml").unlink()
          PY

      - name: Generate documentation
        run: python3 scripts/generate_docs.py

      - name: Validate repository
        run: python3 scripts/validate_repo.py

      - name: Run full tests
        run: python3 -m unittest discover -s tests -v

      - name: Run release checks and demo
        run: |
          python3 scripts/qacraft.py release-check
          python3 scripts/demo.py

      - name: Check patch cleanliness
        run: |
          git diff --check
          git status --short

      - name: Commit validated repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: require existing installation destinations"
          git push origin HEAD:fix/require-existing-destination
