[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "qacraft"
version = "1.2.0"
description = "Reusable QA skills with safe agent adapters and deterministic behavior evaluations"
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "Sudarshan Chaudhari" }
]
requires-python = ">=3.10"
dependencies = []
keywords = [
  "qa",
  "software-testing",
  "quality-assurance",
  "ai-agents",
  "codex",
  "claude-code"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing"
]

[project.scripts]
qacraft = "qacraft:main"

[project.urls]
Homepage = "https://github.com/SUDARSHANCHAUDHARI/QACraft"
Repository = "https://github.com/SUDARSHANCHAUDHARI/QACraft"
Issues = "https://github.com/SUDARSHANCHAUDHARI/QACraft/issues"
Documentation = "https://github.com/SUDARSHANCHAUDHARI/QACraft/tree/main/docs"

[tool.setuptools]
packages = ["qacraft"]

[tool.qacraft]
catalog = "catalog/skills.json"
docs = "docs/index.html"
validator = "scripts/validate_repo.py"
evaluations = "evaluations/rubrics.json"
release_check = "scripts/release_check.py"
distribution_mode = "bundled-artifacts"
bundle_builder = "qacraft_build.py"
source_manifest = "MANIFEST.in"
